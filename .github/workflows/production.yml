name: Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
        
    - name: Type Check
      working-directory: ./frontend
      run: npx tsc --noEmit
      
    - name: Lint
      working-directory: ./frontend
      run: npm run lint
      
    - name: Unit Tests (Vitest)
      working-directory: ./frontend
      run: npx vitest run --coverage
      
    - name: Build
      working-directory: ./frontend
      run: npm run build
